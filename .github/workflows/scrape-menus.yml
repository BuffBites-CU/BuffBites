name: Scrape Daily Menus

on:
  schedule:
    # GitHub delays scheduled runs at busy times, so run twice: 2 AM MT for the
    # day's menus and 9 AM MT to catch late Nutrislice edits.
    - cron: '0 8 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
  # Dry run on scraper changes: scrapes + validates, but only main commits data.
  push:
    branches-ignore: [main]
    paths:
      - 'scraping_scripts/**.py'
      - '.github/workflows/scrape-menus.yml'

concurrency:
  group: scrape-menus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraping_scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scraping_scripts/requirements.txt pytest

      # Gate: never scrape with a broken guard, merger or validator.
      - name: Test scraper helpers
        run: python -m pytest scraping_scripts -q

      # continue-on-error: one hall's outage must not stop the others from
      # refreshing. menu_guard keeps the previous JSON if a scrape comes back
      # empty, and the last step turns the run red if any scrape failed.
      - name: Scrape C4C
        id: c4c
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/c4c_dining.py

      - name: Scrape Libby
        id: libby
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/libby_dining.py

      - name: Scrape Sewall
        id: sewall
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/sewall_dining.py

      - name: Scrape Village Center
        id: village_center
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/village_center_dining.py

      - name: Scrape The Alley
        id: alley
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/alley_dining.py

      - name: Scrape SEEC
        id: seec
        continue-on-error: true
        timeout-minutes: 10
        run: python scraping_scripts/seec_dining.py

      # Small copies the API loads (parsing full C4C needs ~80 MB of RAM).
      - name: Build live menus
        run: python scraping_scripts/build_live_menus.py

      - name: Validate menus
        id: validate
        continue-on-error: true
        run: python scraping_scripts/validate_menus.py

      - name: Commit updated menus
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraping_scripts/data/
          if git diff --cached --quiet; then
            echo "No menu changes today"
          else
            git commit -m "chore: refresh dining menus $(TZ=America/Denver date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      # After the commit, so the halls that did scrape still go live. A step
      # with continue-on-error never fails the job by itself.
      - name: Fail if a scrape or validation failed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1
