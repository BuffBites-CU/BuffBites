name: CI

# Tests and builds for pull requests and work branches. main is covered by
# deploy-backend.yml (backend tests before every deploy), Vercel (frontend
# build) and scrape-menus.yml (scraper tests before every scrape).

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          ANTHROPIC_API_KEY: test
        run: |
          pip install -r requirements.txt pytest==9.1.1
          PYTHONPATH=. pytest tests -q

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraping_scripts/requirements.txt

      - name: Run scraper tests
        working-directory: scraping_scripts
        run: |
          pip install -r requirements.txt pytest==9.1.1
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Build
        run: npx next build
