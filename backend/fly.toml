# fly.toml app configuration file generated for buffbites-backend on 2026-06-03T19:42:53-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buffbites-backend'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# 512 MB: FastAPI + Firebase + Mongo + Anthropic SDK use ~100 MB before any
# menu loads, and 256 MB machines were OOM-killed at ~150 MB. flyctl deploy
# re-applies this, so `flyctl scale memory` alone gets undone on the next deploy.
[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
